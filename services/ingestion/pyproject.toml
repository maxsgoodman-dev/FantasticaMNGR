[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-ingest"
version = "0.1.0"
description = "Source adapters for ingesting and normalizing fantasy sports data"
requires-python = ">=3.10"
dependencies = [
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["fantasy_ingest"]
